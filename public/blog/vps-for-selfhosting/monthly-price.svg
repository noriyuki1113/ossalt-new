<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="t d" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif">
  <title id="t">国内VPS4社の最安プランの月額（月払いと長期契約の換算）</title>
  <desc id="d">月払い：ConoHa VPS 460円、KAGOYA CLOUD VPS 上限550円、さくらのVPS 643円、Xserver VPS 1,980円。長期契約などの換算：ConoHa VPS 293円（36か月）、KAGOYA CLOUD VPS 506円（年額）、さくらのVPS 590円（年払い）、Xserver VPS 1,265円（36か月）。</desc>
  <rect width="720" height="360" rx="10" fill="#fbfaf6" stroke="#d8d4c8"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#1f2430">最安プランの月額（円）：月払いと、長期契約の換算</text>
  <g font-size="13" fill="#1f2430">
    <rect x="24" y="48" width="14" height="14" fill="#2f5d8a"/><text x="44" y="60">月払い</text>
    <rect x="110" y="48" width="14" height="14" fill="#9db8d2"/><text x="130" y="60">長期契約・年払いの換算（条件がそろっていない）</text>
  </g>
  <g font-size="14" fill="#1f2430">
    <text x="24" y="102" font-weight="700">ConoHa VPS</text><text x="24" y="120" font-size="12" fill="#4a5060">512MB</text>
    <rect x="210" y="86" width="78.2" height="20" fill="#2f5d8a"/><text x="296" y="101" font-weight="700">460</text>
    <rect x="210" y="110" width="49.8" height="14" fill="#9db8d2"/><text x="268" y="122" font-size="12" fill="#4a5060">293（36か月契約）</text>

    <text x="24" y="172" font-weight="700">KAGOYA CLOUD VPS</text><text x="24" y="190" font-size="12" fill="#4a5060">1GB</text>
    <rect x="210" y="156" width="93.5" height="20" fill="#2f5d8a"/><text x="312" y="171" font-weight="700">550（上限）</text>
    <rect x="210" y="180" width="86.0" height="14" fill="#9db8d2"/><text x="304" y="192" font-size="12" fill="#4a5060">506（年額6,072円）</text>

    <text x="24" y="242" font-weight="700">さくらのVPS</text><text x="24" y="260" font-size="12" fill="#4a5060">512MB</text>
    <rect x="210" y="226" width="109.3" height="20" fill="#2f5d8a"/><text x="327" y="241" font-weight="700">643</text>
    <rect x="210" y="250" width="100.3" height="14" fill="#9db8d2"/><text x="318" y="262" font-size="12" fill="#4a5060">590（年払い）</text>

    <text x="24" y="312" font-weight="700">Xserver VPS</text><text x="24" y="330" font-size="12" fill="#4a5060">2GB・3コア</text>
    <rect x="210" y="296" width="336.6" height="20" fill="#2f5d8a"/><text x="555" y="311" font-weight="700">1,980</text>
    <rect x="210" y="320" width="215.1" height="14" fill="#9db8d2"/><text x="433" y="332" font-size="12" fill="#4a5060">1,265（36か月契約）</text>
  </g>
</svg>
