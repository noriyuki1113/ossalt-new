<svg xmlns="http://www.w3.org/2000/svg" width="720" height="256" viewBox="0 0 720 256" role="img" aria-labelledby="t d" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif">
  <title id="t">始める順番（Uptime Kuma、BookStack、Mattermost、Vaultwarden）</title>
  <desc id="d">1番目は死活監視のUptime Kuma。2番目は社内WikiのBookStack。3番目はチャットのMattermost。4番目はパスワード管理のVaultwardenで、バックアップと復元が回ることを確かめてから移行する。</desc>
  <rect width="720" height="256" rx="10" fill="#fbfaf6" stroke="#d8d4c8"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#1f2430">始める順番：影響の小さいものから</text>
  <rect x="24" y="56" width="150" height="150" rx="8" fill="#ffffff" stroke="#9db8d2" stroke-width="1"/>
  <circle cx="46" cy="80" r="13" fill="#2f5d8a"/>
  <text x="46" y="85" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="66" y="85" font-size="13" font-weight="700" fill="#1f2430">Uptime Kuma</text>
  <text x="38" y="110" font-size="12" font-weight="700" fill="#4a5060">死活監視</text>
  <text x="38" y="134" font-size="12" fill="#1f2430">止まっても業務に</text>
  <text x="38" y="152" font-size="12" fill="#1f2430">影響がなく、</text>
  <text x="38" y="170" font-size="12" fill="#1f2430">運用の練習になる</text>
  <path d="M178 131 l14 0 m-5 -5 l5 5 l-5 5" fill="none" stroke="#2f5d8a" stroke-width="2"/>
  <rect x="198" y="56" width="150" height="150" rx="8" fill="#ffffff" stroke="#9db8d2" stroke-width="1"/>
  <circle cx="220" cy="80" r="13" fill="#2f5d8a"/>
  <text x="220" y="85" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="240" y="85" font-size="13" font-weight="700" fill="#1f2430">BookStack</text>
  <text x="212" y="110" font-size="12" font-weight="700" fill="#4a5060">社内Wiki</text>
  <text x="212" y="134" font-size="12" fill="#1f2430">新しい文書から</text>
  <text x="212" y="152" font-size="12" fill="#1f2430">使い始める。既存の</text>
  <text x="212" y="170" font-size="12" fill="#1f2430">SaaSは閲覧用に残す</text>
  <path d="M352 131 l14 0 m-5 -5 l5 5 l-5 5" fill="none" stroke="#2f5d8a" stroke-width="2"/>
  <rect x="372" y="56" width="150" height="150" rx="8" fill="#ffffff" stroke="#9db8d2" stroke-width="1"/>
  <circle cx="394" cy="80" r="13" fill="#2f5d8a"/>
  <text x="394" y="85" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="414" y="85" font-size="13" font-weight="700" fill="#1f2430">Mattermost</text>
  <text x="386" y="110" font-size="12" font-weight="700" fill="#4a5060">チャット</text>
  <text x="386" y="134" font-size="12" fill="#1f2430">全員が毎日使う。</text>
  <text x="386" y="152" font-size="12" fill="#1f2430">少人数で試して</text>
  <text x="386" y="170" font-size="12" fill="#1f2430">から広げる</text>
  <path d="M526 131 l14 0 m-5 -5 l5 5 l-5 5" fill="none" stroke="#2f5d8a" stroke-width="2"/>
  <rect x="546" y="56" width="150" height="150" rx="8" fill="#ffffff" stroke="#9db8d2" stroke-width="1"/>
  <circle cx="568" cy="80" r="13" fill="#2f5d8a"/>
  <text x="568" y="85" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="588" y="85" font-size="13" font-weight="700" fill="#1f2430">Vaultwarden</text>
  <text x="560" y="110" font-size="12" font-weight="700" fill="#4a5060">パスワード管理</text>
  <text x="560" y="134" font-size="12" fill="#1f2430">最後。バックアップ</text>
  <text x="560" y="152" font-size="12" fill="#1f2430">と復元が回ると</text>
  <text x="560" y="170" font-size="12" fill="#1f2430">確かめてから移行</text>
  <text x="24" y="236" font-size="13" fill="#4a5060">一度に全部を始めず、段階的に進めます。</text>
</svg>
