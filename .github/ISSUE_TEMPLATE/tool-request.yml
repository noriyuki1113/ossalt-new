name: 掲載リクエスト
description: ossalt.jp に掲載してほしいオープンソースのツールを教えてください
title: "[掲載リクエスト] "
labels: ["掲載リクエスト"]
body:
  - type: markdown
    attributes:
      value: |
        ご提案ありがとうございます。いただいた内容は公開されます。個人情報は書かないでください。
        掲載するかどうかは運営者が判断します。掲載料はかからず、掲載の順番や評価が変わることもありません。
        掲載の条件は https://ossalt.jp/submit/ をご覧ください。
  - type: input
    id: name
    attributes:
      label: ツール名
      placeholder: 例）Uptime Kuma
    validations:
      required: true
  - type: input
    id: repo
    attributes:
      label: GitHubのリポジトリURL
      description: スター数や更新状況などを GitHub から自動で取得するため、GitHub のリポジトリが必要です。
      placeholder: https://github.com/louislam/uptime-kuma
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: 公式サイトのURL
      description: 無い場合は空欄のままで構いません。
      placeholder: https://uptime.kuma.pet/
  - type: input
    id: competitor
    attributes:
      label: 代わりになるSaaS
      description: このツールで置き換えられる、有料のサービスを1つ書いてください。
      placeholder: 例）UptimeRobot
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: カテゴリ
      options:
        - "わからない"
        - "ノート・ドキュメント（note-docs）"
        - "チャット・コミュニケーション（communication）"
        - "プロジェクト管理（project）"
        - "データベース・表作成（database）"
        - "CMS・コンテンツ管理（cms）"
        - "アクセス解析・プロダクト分析（analytics）"
        - "監視・エラー追跡（observability）"
        - "認証・パスワード管理（security）"
        - "開発・デプロイ基盤（devtools）"
        - "業務自動化（automation）"
        - "ファイル管理・写真（files）"
        - "デザイン・図解（design）"
        - "ローコード・BI（nocode）"
        - "マーケティング・フォーム（marketing）"
        - "カスタマーサポート（support）"
        - "予約・スケジュール（scheduling）"
        - "CRM・営業（crm）"
        - "PDF・文書処理（documents）"
        - "オフィス・グループウェア（office）"
        - "メール（email）"
        - "人事・勤怠・採用（hr）"
        - "会計・請求書・経費（accounting）"
        - "電子契約・法務（legal）"
        - "バックアップ（backup）"
        - "AI・LLM基盤（ai）"
        - "ビデオ会議・配信（video）"
        - "EC・決済（ecommerce）"
        - "翻訳（translation）"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: どんなツールか（日本語で1〜2文）
      placeholder: 例）Webサイトやサーバーの死活監視を自前で行えるツール。通知はSlackやメールなどに送れる。
    validations:
      required: true
  - type: dropdown
    id: relation
    attributes:
      label: このツールとの関係
      options:
        - 利用者・読者
        - 開発者・関係者
        - その他
    validations:
      required: true
  - type: textarea
    id: note
    attributes:
      label: 補足（任意）
      description: 日本語に対応しているか、どんな場面で便利かなど、自由にお書きください。
