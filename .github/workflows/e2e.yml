name: ブラウザテスト（E2E）

# PR と手動実行だけで動く。公開用ブランチへの push では動かさない
# （公開の処理 deploy-pages.yml と重ならず、不要なビルドも増やさない）。
# 公開・マージ・書き込みは一切しない。権限は読み取りのみ。
on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "ops/cloudflare/**"
      - "content/**"
      - "public/**"
      - "e2e/**"
      - "e2e-analytics/**"
      - "playwright.config.ts"
      - "next.config.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: 単体テスト
        run: npm test
      - name: ビルド
        env:
          NEXT_PUBLIC_SITE_URL: https://ossalt.jp
          # For You の導線（機能フラグ）も含めて検証する。本番の公開は deploy-pages.yml の Variables で決まる
          NEXT_PUBLIC_FEATURE_FOR_YOU: "1"
        run: npm run build
      # 計測（PostHog）のE2E用に、ダミーのトークンとモックのホストを埋め込んだビルドを別に作る（out/ は残る）。
      # 実際のPostHogには接続しない。
      - name: 計測E2E用のビルド
        env:
          NEXT_PUBLIC_SITE_URL: https://ossalt.jp
        run: npm run build:analytics-e2e
      - name: ブラウザのインストール
        run: npx playwright install --with-deps chromium
      - name: ブラウザテスト（デスクトップ・スマホ・計測）
        run: npm run test:e2e
      - name: 結果をサマリに表示
        if: always()
        run: |
          node -e '
            const fs=require("fs");
            try{
              const r=JSON.parse(fs.readFileSync("test-results/results.json","utf8")).stats;
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
                `### ブラウザテスト\n- 成功 ${r.expected}\n- 失敗 ${r.unexpected}\n- 不安定 ${r.flaky}\n- スキップ ${r.skipped}\n`);
            }catch{ fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,"結果ファイルがありません\n"); }'
      - name: 失敗時のスクリーンショット・トレース・ログを保存
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 14
