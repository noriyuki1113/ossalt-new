name: OpenAlternative 候補の確認キュー

# 毎週月曜 06:11 JST（日曜 21:11 UTC）と、手動実行。
# OpenAlternative（piotrkulpinski/open-source-alternatives）の一覧から新しい候補を見つけ、
# 公式リポジトリ（GitHub API）で確認した結果を data-source/discovery/openalt-queue.json に書く。
# 処理は scripts/discover-openalt.mjs（設計：docs/discovery/OPENALT_QUEUE.md）。
#
# ・data-source/tools.json には一切触れない（サイトの掲載は変わらない）。掲載は人が「ツール追加」で行う。
# ・GITHUB_TOKEN での push なので「GitHub Pages 公開」は動かない（サイトには影響しない）。
# ・1回に処理する新規の候補数（max_new）と GitHub API のリクエスト数（max_requests）に上限がある。残りは次回の続き。
# ・AI は使わない（費用は0）。
on:
  schedule:
    - cron: "11 21 * * 0"
  workflow_dispatch:
    inputs:
      max_new:
        description: "1回で処理する新規の候補数（既定 100。GitHub API は1件あたり2リクエスト）"
        required: false
        type: string
        default: "100"
      max_requests:
        description: "GitHub API のリクエストの上限（既定 300）"
        required: false
        type: string
        default: "300"

permissions:
  contents: write

concurrency:
  group: openalt-queue
  cancel-in-progress: false

jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: ETag の控えを復元
        uses: actions/cache@v4
        with:
          path: data-source/discovery/.etag-cache-openalt.json
          key: openalt-etag-${{ github.run_id }}
          restore-keys: openalt-etag-

      # 入力は env: 経由で受け取る（run: に直接埋め込まない）
      - name: 収集と確認
        env:
          GITHUB_TOKEN: ${{ secrets.DATA_FETCH_TOKEN || secrets.GITHUB_TOKEN }}
          OPENALT_MAX_NEW: ${{ inputs.max_new || '100' }}
          OPENALT_MAX_REQUESTS: ${{ inputs.max_requests || '300' }}
        run: node scripts/discover-openalt.mjs

      - name: 結果をサマリに表示
        run: |
          {
            echo "## 確認キューの更新結果"
            echo '```json'
            node -e "const s=require('./data-source/discovery/openalt-state.json');console.log(JSON.stringify({summary:s.summary,github:{requests:s.github.requests,notModified:s.github.notModified,errors:s.github.errors,budget_stopped:s.github.budget_stopped},errors:s.errors.length},null,2))"
            echo '```'
            echo "一覧：docs/discovery/openalt-queue.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: コミットと push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-source/discovery/openalt-queue.json data-source/discovery/openalt-state.json docs/discovery/openalt-queue.md
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "data: OpenAlternative 候補の確認キュー $(date -u -d '+9 hours' +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
