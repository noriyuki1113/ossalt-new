name: "[一時] advisories_countのみ再取得"

# 384件を7項目まとめて再取得する update-data.yml が長時間化したため、
# advisories_countだけを軽量に直すための一時ワークフロー。
# 独自のconcurrencyグループを使い、update-dataの実行待ちに影響しない。
on:
  push:
    paths:
      - ".github/workflows/_fix-advisories.yml"
      - "scripts/fix-advisories-count.mjs"

permissions:
  contents: write

concurrency:
  group: fix-advisories
  # このセッションのGitHub App統合からは実行中のワークフローをAPI経由で
  # キャンセルできない（403）。true にしておけば、新しいpush（この
  # ワークフローファイル自体を変更した場合）が来たときにGitHub Actions
  # 自身が古い（応答待ちで止まった）実行を自動キャンセルしてくれる。
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: advisories_countのみ再取得
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_DATA_TOKEN || secrets.GITHUB_TOKEN }}
          FETCH_CONCURRENCY: "3"
        run: node scripts/fix-advisories-count.mjs

      - name: サイト用データ生成
        run: node scripts/build-data.mjs

      # update-data.yml の長時間実行と並行して走る可能性があるため、
      # pushの直前にrebaseして非fast-forwardによる失敗を避ける。
      - name: コミットと push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-source/tools.json public/data/tools.json public/data/meta.json public/data/categories.json
          if git diff --cached --quiet; then
            echo "更新なし"
          else
            git commit -m "fix(data): advisories_countを再取得"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
