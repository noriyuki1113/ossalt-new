name: "[一時] Scorecard API 診断"

# タスク0の切り分け専用。用が済んだら削除する一時ワークフロー。
on:
  push:
    paths:
      - ".github/workflows/_diag-scorecard.yml"
      - "scripts/check-scorecard.mjs"

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Scorecard API を叩いて応答を確認する
        run: |
          node scripts/check-scorecard.mjs --ids ollama,immich,uptime-kuma,vaultwarden,authentik,gitea,keycloak
