name: GitHub Pages 公開

# 既定ブランチへの push、手動実行、データ更新ワークフローの完了後に公開する。
# （データ更新は GITHUB_TOKEN で push するため、push トリガーでは起動しない）
on:
  push:
  workflow_dispatch:
  workflow_run:
    workflows: ["データ更新", "ツール追加", "月次レポート", "プレビュー画像の取得"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # push は既定ブランチのときだけ。データ更新は成功したときだけ。
    if: >-
      (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run のときはデータ更新後の最新コミットを取る
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      # https://<owner>.github.io/<repo>/ ならサブパス /<repo> を、独自ドメインなら空を使う。
      # リポジトリ名の変更や独自ドメインの設定に自動で追従する。
      - name: ビルド
        env:
          NEXT_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # 独自ドメイン設定直後は configure-pages が http:// を返すことがある。
          # 明示値(Variables)があればそちらを優先し、canonical/sitemapをhttpsに固定する。
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || steps.pages.outputs.base_url }}
          # 運営者情報。未設定なら各ページで自然に非表示になる(「準備中」を出さない)。
          # NEXT_PUBLIC_ はビルド時に埋め込まれる公開値。Secrets ではなく Variables で渡す。
          NEXT_PUBLIC_OPERATOR_NAME: ${{ vars.NEXT_PUBLIC_OPERATOR_NAME }}
          NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.NEXT_PUBLIC_CONTACT_EMAIL }}
          NEXT_PUBLIC_CONTACT_URL: ${{ vars.NEXT_PUBLIC_CONTACT_URL }}
          NEXT_PUBLIC_PRIVACY_EFFECTIVE_DATE: ${{ vars.NEXT_PUBLIC_PRIVACY_EFFECTIVE_DATE }}
          # OSSALT For You の公開（"1" のときだけナビ・導線・サイトマップに載る）。未設定なら試験公開（noindex）
          NEXT_PUBLIC_FEATURE_FOR_YOU: ${{ vars.NEXT_PUBLIC_FEATURE_FOR_YOU }}
          # 計測（PostHog）。Project Token（phc_）とホストの両方を Variables に設定したときだけ有効になる。
          # Personal API Key（phx_）は絶対に入れない。未設定のままなら、同意バナーも通信も出ない。
          NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ vars.NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
          # 検索エンジンの所有権確認のメタタグ（任意。通常は不要）
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
          NEXT_PUBLIC_BING_SITE_VERIFICATION: ${{ vars.NEXT_PUBLIC_BING_SITE_VERIFICATION }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
