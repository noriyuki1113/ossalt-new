name: データ更新

# 毎日 18:00 UTC（＝翌 03:00 JST）に実行。手動実行も可能（Actions タブ → データ更新 → Run workflow）。
# 成功すると「GitHub Pages 公開」ワークフローが続けて動き、サイトに反映される。
on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

# データ更新をリポジトリへ push するため書き込み権限が要る
permissions:
  contents: write

concurrency:
  group: update-data
  # 応答が返らない接続でハングした実行が6時間以上残ってしまったことが
  # あったため、新しい実行が来たら古い（おそらく詰まっている）実行を
  # 自動キャンセルする。このpushでも、まだ残っている古い実行を片付ける。
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 1) GitHub API からリポジトリ情報・セキュリティ関連シグナルを取得する。
      #    既定の GITHUB_TOKEN は「1リポジトリあたり 1時間 1,000リクエスト」
      #    の上限があり、現在の取得項目（約6リクエスト/ツール × 384件 =
      #    約2,304）では足りないため 403 が発生する。
      #    Personal Access Token（上限 5,000/時間）を DATA_FETCH_TOKEN として
      #    登録してあればそちらを使う。無ければ GITHUB_TOKEN にフォールバックする。
      #    ※ GitHub は「GITHUB_」で始まるシークレット名を作成できないため
      #      （実際に拒否された）、Secretの名前にその接頭辞を使わないこと。
      #    DATA_FETCH_TOKEN が無い場合は FETCH_SHARDS で日ごとに1/3ずつ
      #    取得し、1回の実行が上限に収まるようにする。
      # シャード数をツール数から自動計算する。
      # ・DATA_FETCH_TOKEN（PAT・上限5,000リクエスト/時）があれば 1（全件一括）
      # ・無ければ ceil(ツール数×約8リクエスト÷900) で日またぎ分割
      #   （Docker判定の追加で約6→約8。Docker判定は30日に1回だけ取り直す）
      #   例: 388件→4、700件→7、1000件→9 と自動で増える
      - name: シャード数の自動計算
        id: shard
        env:
          HAS_PAT: ${{ secrets.DATA_FETCH_TOKEN != '' }}
        run: |
          N=$(node -e "console.log(JSON.parse(require('fs').readFileSync('data-source/tools.json','utf8')).length)")
          if [ "$HAS_PAT" = "true" ]; then
            S=1
          else
            S=$(( (N * 8 + 899) / 900 ))
            if [ "$S" -lt 1 ]; then S=1; fi
          fi
          echo "ツール数: ${N}件 → シャード数: ${S}"
          echo "value=$S" >> "$GITHUB_OUTPUT"

      - name: GitHub データ取得
        env:
          GITHUB_TOKEN: ${{ secrets.DATA_FETCH_TOKEN || secrets.GITHUB_TOKEN }}
          FETCH_CONCURRENCY: "2"
          FETCH_SHARDS: ${{ steps.shard.outputs.value }}
        run: node scripts/fetch-github-api.mjs

      # 2) tools.json からサイトが読む public/data/*.json を再生成する
      - name: サイト用データ生成
        run: node scripts/build-data.mjs

      # 3) 差分があればコミットして push（変更がなければ何もしない）。
      #    実行中に別のpushが入ると非fast-forwardでpushが失敗するため、
      #    push直前にrebaseする。
      - name: コミットと push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-source/tools.json public/data/tools.json public/data/meta.json public/data/categories.json
          if git diff --cached --quiet; then
            echo "更新なし"
          else
            git commit -m "data: 日次更新 $(date -u +%Y-%m-%d)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
