name: データ更新

# 毎日 18:00 UTC（＝翌 03:00 JST）に実行。手動実行も可能（Actions タブ → データ更新 → Run workflow）。
# 成功すると「GitHub Pages 公開」ワークフローが続けて動き、サイトに反映される。
on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

# データ更新をリポジトリへ push するため書き込み権限が要る
permissions:
  contents: write

concurrency:
  group: update-data
  # 応答が返らない接続でハングした実行が6時間以上残ってしまったことが
  # あったため、新しい実行が来たら古い（おそらく詰まっている）実行を
  # 自動キャンセルする。このpushでも、まだ残っている古い実行を片付ける。
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 1) GitHub API からスター数・フォーク数・コントリビュータ数・
      #    ウォッチャー数・最終コミット・言語・ライセンスを取得する。
      #    Secrets の GITHUB_DATA_TOKEN があればそちらを使い、なければ
      #    ワークフロー既定の GITHUB_TOKEN を使う。
      # セキュリティ関連シグナル追加後、1ツールあたりの取得件数が増えた
      # （repo/contributors に加えてScorecard/SECURITY.md/dependabot/
      # releases/advisoriesの5件が並行して走る）。並列数4だと同時に
      # 最大20リクエストがapi.github.comへ飛び、GitHubの二次レート制限に
      # 引っかかって長時間の待機が発生することを実測で確認したため、
      # 並列数を落として同時リクエスト数を抑える。
      - name: GitHub データ取得
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_DATA_TOKEN || secrets.GITHUB_TOKEN }}
          FETCH_CONCURRENCY: "2"
        run: node scripts/fetch-github-api.mjs

      # 2) tools.json からサイトが読む public/data/*.json を再生成する
      - name: サイト用データ生成
        run: node scripts/build-data.mjs

      # 3) 差分があればコミットして push（変更がなければ何もしない）
      - name: コミットと push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-source/tools.json public/data/tools.json public/data/meta.json public/data/categories.json
          if git diff --cached --quiet; then
            echo "更新なし"
          else
            git commit -m "data: 日次更新 $(date -u +%Y-%m-%d)"
            git push
          fi
