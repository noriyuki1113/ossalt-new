# Cloudflare Workers の設定（リモートMCP）
# デプロイは .github/workflows/deploy-mcp.yml から行う。
name = "ossalt-mcp"
main = "src/worker.mjs"
compatibility_date = "2025-09-01"

# https://mcp.ossalt.jp/mcp で公開する（ossalt.jp のゾーンにサブドメインを自動で作る）
routes = [{ pattern = "mcp.ossalt.jp", custom_domain = true }]

# workers.dev のURL（アカウント名が入る）とプレビュー用のURLは使わない
workers_dev = false
preview_urls = false
